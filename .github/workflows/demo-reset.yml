# The public demo's nightly reset (docs/operations.md, "The public demo"):
# empties the demo's Supabase project (all but the testers' feedback) and
# loads the demo data again, so its calendar always has a realistic today.
# It runs the demo branch's code (what's live), never main's: main's seeds
# can need tables the demo's database doesn't have until the next release.
# The reset refuses a database whose migrations aren't exactly that code's,
# loads everything in one transaction (a failure keeps yesterday's data) and
# checks both salons have staff and visits today after. Any failure fails
# the run, and GitHub emails whoever last changed this schedule (Settings →
# Notifications → Actions).
# It must run at night in the US: the reset holds every table for about a
# minute (pages wait on it) and signs everyone out. GitHub starts scheduled
# runs late, sometimes by hours (the 07:30 run came at 13:47, 14:25 and
# 17:20 UTC), so there are four night slots, and a run resets only between
# 06:00 and 12:00 UTC (after midnight in Chicago, before the morning in
# New York) and only if tonight's reset hasn't happened yet (the salons'
# rows are as old as the last reset). Runs only once the repository has the
# demo's secrets; "Run workflow" on the Actions tab resets now, whatever
# the time.
name: Reset the demo

on:
  schedule:
    - cron: "13 6 * * *"
    - cron: "43 7 * * *"
    - cron: "13 9 * * *"
    - cron: "43 10 * * *"
  workflow_dispatch:

concurrency: demo-reset

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEMO_DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEMO_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.DEMO_SUPABASE_SECRET_KEY }}
      DEMO_AI_DAILY_TOKENS: ${{ vars.DEMO_AI_DAILY_TOKENS }}
    steps:
      - name: Check the demo's secrets are set
        run: |
          if [ -z "$DEMO_DATABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::Add DEMO_DATABASE_URL, DEMO_SUPABASE_URL and DEMO_SUPABASE_SECRET_KEY as repository secrets."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: demo
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: psql
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Only at night, once a night
        id: when
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          hour=$((10#$(date -u +%H)))
          if [ "$hour" -lt 6 ] || [ "$hour" -ge 12 ]; then
            echo "::notice::Started at $(date -u +%H:%M) UTC, outside the night window (06:00-12:00 UTC): not resetting while testers may be on the demo."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          fresh=$(psql "$DEMO_DATABASE_URL" -tAc "select coalesce(max(created_at) > now() - interval '7 hours', false) from public.businesses")
          if [ "$fresh" = "t" ]; then
            echo "::notice::Already reset tonight."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: Reset
        if: steps.when.outputs.go == 'true'
        run: npm run demo:db -- reset --yes
